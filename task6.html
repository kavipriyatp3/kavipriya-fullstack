<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let amount= 3500;

        if(amount > 3000){
            let discount=amount*10/100;
            let finalAmount=amount-discount;

            document.write("Shopping Amount:₹"+amount+"<br>");
            document.write("Discount:₹"+discount+"<br>");
            document.write("FinalAmount:₹"+finalAmount);
        }
        else{
            document.write("Shopping Amount:₹"+amount+"<br>");
            document.write("Discount:₹"+discount+"<br>");
            document.write("FinalAmount:₹"+finalAmount);
        }
        
    </script>
   
    
</body>
</html>
