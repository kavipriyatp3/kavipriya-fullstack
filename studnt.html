<!DOCTYPE html>
<html>
<head>
  <title>Student Result & Eligibility Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0px;
      box-sizing: border-box;
    }
    .container {
      width: 400px;
      margin: auto;
      padding: 20px;
      border: 1px solid black;
      border-radius: 8px;
      background: burlywood;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid black;
      background: #fff;
    }
    h2 {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Result & Eligibility Analyzer</h2>
    <form id="studentForm">
      <label>Student Name:</label>
      <input type="text" id="name">

      <label>Student ID:</label>
      <input type="text" id="studentId">

      <label>Email:</label>
      <input type="text" id="email">

      <label>Department:</label>
      <select id="department">
        <option value="Java Full Stack">Java Full Stack</option>
        <option value="Python Full Stack">Python Full Stack</option>
        <option value="MERN Stack">MERN Stack</option>
        <option value="Data Analytics">Data Analytics</option>
      </select>

      <label>Mark:</label>
      <input type="number" id="mark">

      <button type="button" onclick="analyze()">Analyze Result</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    function analyze() {
      
      let name = document.getElementById("name").value.trim();
            if (name === "") {
        alert("Name cannot be empty!");
        return;
      }

      name = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
      let studentId = document.getElementById("studentId").value.trim();
       let validId = studentId.startsWith("STU") && studentId.length === 6;
      let email = document.getElementById("email").value.trim();
       let validEmail = email.includes("@") && email.includes(".");
      let department = document.getElementById("department").value;
      let mark = Number(document.getElementById("mark").value);
       if (isNaN(mark) || mark < 0 || mark > 100) {
        document.getElementById("result").innerHTML = "<strong>Invalid Mark</strong>";
        return;
      }

      let grade = "";
      if (mark >= 90) grade = "A+";
      else if (mark >= 80) grade = "A";
      else if (mark >= 70) grade = "B";
      else if (mark >= 60) grade = "C";
      else if (mark >= 50) grade = "D";
      else grade = "F";


      let result = mark >= 50 ? "PASS" : "FAIL";

      
      let eligibility = (mark >= 60 && validEmail && validId) 
                        ? "Eligible for Next Level" 
                        : "Not Eligible";

      
      let deptMessage = "";
      switch(department) {
        case "Java Full Stack":
          deptMessage = "Recommended: Advanced Java & Spring Boot";
          break;
        case "Python Full Stack":
          deptMessage = "Recommended: Django & REST API";
          break;
        case "MERN Stack":
          deptMessage = "Recommended: React, Node.js & MongoDB";
          break;
        case "Data Analytics":
          deptMessage = "Recommended: Machine Learning & Power BI";
          break;
        default:
          deptMessage = "No recommendation available.";
      }

      let performance = mark >= 80 ? "Excellent" 
                        : mark >= 60 ? "Good" 
                        : "Needs Improvement";

      document.getElementById("result").innerHTML = `
        =================================<br>
        <strong>STUDENT RESULT</strong><br>
        =================================<br><br>
        Name          : ${name} <br>
        Student ID    : ${studentId} <br>
        Email         : ${email} <br>
        Department    : ${department} <br><br>
        Mark          : ${mark} <br>
        Grade         : ${grade} <br>
        Result        : ${result} <br><br>
        Performance   : ${performance} <br>
        Eligibility   : ${eligibility} <br><br>
        Department Msg: ${deptMessage}
      `;
    }
  </script>
</body>
</html>
