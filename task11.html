<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JAVASCRIPT</h1>
    <div class="con" id="con">

    </div>
    <script>
        const arr=["red","green","blue"]
        tag=""
        for(let i=0;i<arr.length;++i){
            li=`<li style= "color:${arr[i]};"> ${arr[i]} </li>`;
            tag+=li
            alert(tag);
        }
        document.getElementById("con").innerHTML="<ul>"+tag+"</ul>";


    </script>

    
    
</body>
</html>
